name: build-windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # attach release artifacts on tag builds

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm install --no-fund --no-audit

      - name: Generate icon set (pure-Node PNG encoder + tauri icon)
        run: node scripts/ensure-icons.mjs

      - name: Frontend unit tests (vitest)
        run: npm test

      - name: Build frontend (tsc + vite, produces dist/)
        run: npm run build

      - name: Rust unit tests (data layer)
        shell: bash
        run: |
          set -uo pipefail
          cat > probe.ps1 <<'PSEOF'
          $src = @"
          using System;
          using System.Runtime.InteropServices;
          public static class P {
            [DllImport("kernel32", SetLastError=true)] public static extern IntPtr LoadLibrary(string name);
            [DllImport("kernel32")] public static extern IntPtr GetProcAddress(IntPtr h, string proc);
          }
          "@
          Add-Type -TypeDefinition $src
          $h = [P]::LoadLibrary("advapi32.dll")
          Write-Output ("PROBE advapi32 handle = 0x{0:X}" -f [Int64]$h)
          foreach ($f in @("CredWriteW","CredReadW","CredFree","CredDeleteW","SystemFunction036")) {
            $a = [P]::GetProcAddress($h, $f)
            $state = "MISSING"
            if ([Int64]$a -ne 0) { $state = "ok" }
            Write-Output ("PROBE {0} {1}" -f $f, $state)
          }
          PSEOF
          powershell -NoProfile -ExecutionPolicy Bypass -File probe.ps1 2>&1 | tee test-output.log

          status=0
          cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast 2>&1 | tee -a test-output.log || status=$?
          if [ $status -ne 0 ]; then
            echo "=== first run failed (exit $status); diagnosing ===" | tee -a test-output.log
            EXE=$(ls -t src-tauri/target/debug/deps/zcode_usage_panel_lib-*.exe 2>/dev/null | head -1)
            if [ -n "$EXE" ]; then
              cat > walk-imports.ps1 <<'PSEOF'
              param([string]$ExePath)
              $src = @"
              using System;
              using System.Runtime.InteropServices;
              public static class P {
                [DllImport("kernel32", SetLastError=true)] public static extern IntPtr LoadLibrary(string name);
                [DllImport("kernel32")] public static extern IntPtr GetProcAddress(IntPtr h, string proc);
              }
              "@
              Add-Type -TypeDefinition $src
              $bytes = [System.IO.File]::ReadAllBytes($ExePath)
              $off = [BitConverter]::ToInt32($bytes, 0x3C)
              $opt = $off + 24
              $magic = [BitConverter]::ToUInt16($bytes, $opt)
              $ddir = if ($magic -eq 0x20b) { $opt + 112 } else { $opt + 96 }
              $numSec = [BitConverter]::ToUInt16($bytes, $off + 6)
              $secOff = $opt + [BitConverter]::ToUInt16($bytes, $off + 20)
              function RvaToOff([uint32]$rva) {
                for ($i=0; $i -lt $numSec; $i++) {
                  $s = $secOff + 40*$i
                  $va = [BitConverter]::ToUInt32($bytes, $s+12); $vs = [BitConverter]::ToUInt32($bytes, $s+8)
                  $pr = [BitConverter]::ToUInt32($bytes, $s+20); $ps = [BitConverter]::ToUInt32($bytes, $s+16)
                  if ($rva -ge $va -and $rva -lt ($va + [Math]::Max($vs,$ps))) { return $pr + ($rva - $va) }
                }
                return [uint32]0
              }
              $importRVA = [BitConverter]::ToUInt32($bytes, $ddir + 8)
              if ($importRVA -eq 0) { Write-Output "IMPORT-WALK no import directory"; exit }
              $d = RvaToOff $importRVA
              if ($d -eq 0) { Write-Output "IMPORT-WALK rva map failed"; exit }
              $dllCount = 0; $missing = 0; $checked = 0
              while ($true) {
                $nameRva = [BitConverter]::ToUInt32($bytes, $d+12)
                $oftRva = [BitConverter]::ToUInt32($bytes, $d+0)
                $ftRva  = [BitConverter]::ToUInt32($bytes, $d+16)
                if ($nameRva -eq 0 -and $oftRva -eq 0) { break }
                $no = RvaToOff $nameRva
                $dll = ""
                for ($i=0; $i -lt 260; $i++) { $c = $bytes[$no+$i]; if ($c -eq 0) { break }; $dll += [char]$c }
                $dllCount++
                $lh = [P]::LoadLibrary($dll)
                if ([Int64]$lh -eq 0) { Write-Output "IMPORT MISSING dll $dll (LoadLibrary failed)"; $missing++; $d += 20; continue }
                $thunkRva = if ($oftRva -ne 0) { $oftRva } else { $ftRva }
                $t = RvaToOff $thunkRva
                for ($j=0; $j -lt 100000; $j++) {
                  $val = [BitConverter]::ToUInt64($bytes, $t + 8*$j)
                  if ($val -eq 0) { break }
                  if (($val -band 0x8000000000000000) -ne 0) { continue }
                  $hn = RvaToOff ([uint32]($val -band 0xFFFFFFFF))
                  $sym = ""
                  for ($k=0; $k -lt 260; $k++) { $c = $bytes[$hn+2+$k]; if ($c -eq 0) { break }; $sym += [char]$c }
                  $checked++
                  $a = [P]::GetProcAddress($lh, $sym)
                  if ([Int64]$a -eq 0) { Write-Output "IMPORT MISSING $dll!$sym"; $missing++ }
                }
                $d += 20
              }
              Write-Output "IMPORT-WALK dlls=$dllCount symbols=$checked missing=$missing"
              PSEOF
              echo "=== import cross-check on $EXE ===" | tee -a test-output.log
              powershell -NoProfile -ExecutionPolicy Bypass -File walk-imports.ps1 -ExePath "$(cygpath -w "$EXE")" 2>&1 | tee -a test-output.log
            fi
            echo "=== single-threaded rerun ===" | tee -a test-output.log
            RUST_BACKTRACE=1 cargo test --lib --manifest-path src-tauri/Cargo.toml -- --test-threads=1 --nocapture 2>&1 | tee -a test-output.log || true
            exit 1
          fi

      - name: Surface failing tests as annotations (on failure)
        if: failure()
        shell: bash
        run: |
          # Mirror cargo failures into workflow annotations (annotations are
          # readable without log access) and keep the full log as artifact.
          # Crash signatures (exit code 0x…, STATUS_*, stack overflow) come
          # first, then the log tail — the single-threaded rerun tail shows
          # the last test that started before a hard crash.
          {
            grep -E "PROBE |IMPORT MISSING|IMPORT-WALK" test-output.log | head -10
            grep -E "panicked at|has overflowed|stack overflow|STATUS_|exit code: 0x|fatal runtime|abnormal termination|^test .*FAILED|^failures:|^---- |^error(\[E[0-9]+\])?:" test-output.log | head -10
            echo '=== LOG TAIL ==='
            tail -n 25 test-output.log
          } > fails.txt || true
          n=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            n=$((n+1)); [ $n -gt 8 ] && break
            msg=$(echo "$line" | cut -c1-240 | sed 's/%/%25/g; s/\r//g; s/\n//g')
            echo "::error title=Cargo failure $n::$msg"
          done < fails.txt

      - name: Upload test log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log

      - name: Data-layer performance benchmark (1M records / 10k sessions)
        run: cargo run --release --manifest-path src-tauri/Cargo.toml --example bench

      - name: Build Windows NSIS installer
        run: npx tauri build

      - name: Normalize artifact names
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $setup.FullName "ZCode-Usage-Panel-Setup-$v.exe"
          # Portable = standalone exe + notice, zipped
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item "src-tauri/target/release/zcode-usage-panel.exe" "portable/ZCode-Usage-Panel.exe"
          Copy-Item scripts/README-PORTABLE.txt portable/README.txt
          Compress-Archive -Path portable/* -DestinationPath "ZCode-Usage-Panel-Portable-$v.zip"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            ZCode-Usage-Panel-Setup-*.exe
            ZCode-Usage-Panel-Portable-*.zip

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ZCode-Usage-Panel-Setup-*.exe
            ZCode-Usage-Panel-Portable-*.zip
          generate_release_notes: true
